name: FWArmy three-platform build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create/update GitHub Release from this run (manual publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: fwarmy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            bin: FWArmy.exe
          - os: macos-26-intel
            platform: macos-x64
            bin: FWArmy
          - os: macos-26
            platform: macos-arm64
            bin: FWArmy
          - os: ubuntu-latest
            platform: linux-x64
            bin: FWArmy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Build single-file binary
        run: node build-sea.mjs

      - name: macOS ad-hoc signature check
        if: runner.os == 'macOS'
        run: |
          file dist/FWArmy
          codesign --verify --strict --verbose=2 dist/FWArmy
          # spctl rejects unsigned binaries as expected; log only, never fail the build on it.
          spctl -a -vv dist/FWArmy || true

      - name: Package
        run: node packaging/package.mjs --platform=${{ matrix.platform }}

      - name: Installer smoke (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd out
          # package.mjs already wrote SHA256SUMS; regenerate one from the .sha256 files here for the installer smoke (must match the package)
          cat *.sha256 > SHA256SUMS
          TMPHOME="$RUNNER_TEMP/fwarmy-install-home"
          TMPINST="$RUNNER_TEMP/fwarmy-install-dir"
          rm -rf "$TMPHOME" "$TMPINST"
          mkdir -p "$TMPHOME"
          FWARMY_BASE="$PWD" FWARMY_HOME="$TMPINST" HOME="$TMPHOME" sh ../install.sh
          test -x "$TMPINST/FWArmy"
          "$TMPINST/FWArmy" --version
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "$TMPINST/FWArmy.command"
            codesign --verify --strict --verbose=2 "$TMPINST/FWArmy"
          else
            test -f "$TMPHOME/.local/share/applications/fwarmy.desktop"
            test -x "$TMPHOME/.local/bin/fwarmy"
          fi
          mkdir -p "$TMPINST/data"
          echo keep > "$TMPINST/data/keep.txt"
          FWARMY_BASE="$PWD" FWARMY_HOME="$TMPINST" HOME="$TMPHOME" sh ../install.sh >/dev/null
          test -f "$TMPINST/data/keep.txt"

      - name: Installer smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location out
          # package.mjs already wrote SHA256SUMS; regenerate one from the .sha256 files here for the installer smoke (must match the package)
          Get-ChildItem *.sha256 | ForEach-Object { Get-Content $_.FullName } | Set-Content SHA256SUMS
          $tmp = Join-Path $env:RUNNER_TEMP 'fwarmy-install'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          $env:FWARMY_BASE = (Get-Location).Path
          $env:LOCALAPPDATA = $tmp
          $env:FWARMY_SKIP_SHORTCUT = '1'
          & ..\install.ps1
          $exe = Join-Path $tmp 'FWArmy\FWArmy.exe'
          $pSmoke = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($pSmoke.ExitCode -ne 0) { throw 'installed exe --version failed' }
          New-Item -ItemType Directory -Force (Join-Path $tmp 'FWArmy\data') | Out-Null
          Set-Content (Join-Path $tmp 'FWArmy\data\keep.txt') 'keep'
          & ..\install.ps1 | Out-Null
          if (-not (Test-Path (Join-Path $tmp 'FWArmy\data\keep.txt'))) { throw 'upgrade lost data' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FWArmy-${{ matrix.platform }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.sha256
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Release publishing is wired up but off by default:
  #  - a tag push (v*) enters this job automatically and uploads to that tag's Release;
  #  - workflow_dispatch publishes only when publish_release is checked.
  # Trust note: there is no independent manifest signature (no secrets/private key);
  # the updater trusts only the GitHub Release asset digests - do not pretend a signing step exists.
  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble release assets + SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Collect all platform packages and their .sha256 (never data/, server.log, secret.key - excluded at packaging time)
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -n {} dist-release/ \;
          : > dist-release/SHA256SUMS
          for f in dist-release/*.zip dist-release/*.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # Prefer the .sha256 shipped with the packaged artifact; compute on the fly otherwise
            src=$(find release-assets -name "${base}.sha256" | head -n1 || true)
            if [ -n "${src:-}" ] && [ -f "$src" ]; then
              cat "$src" >> dist-release/SHA256SUMS
            else
              sha256sum "$f" | awk -v b="$base" '{print $1"  "b}' >> dist-release/SHA256SUMS
            fi
          done
          # Install scripts ship with the Release; the __VERSION__ placeholder is replaced with the real package.json version.
          cp install.sh install.ps1 dist-release/
          VER=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)
          [ -n "$VER" ] || { echo 'cannot read version from package.json' >&2; exit 1; }
          sed -i "s/__VERSION__/$VER/g" dist-release/install.sh dist-release/install.ps1
          echo '=== release assets ==='
          ls -la dist-release
          echo '=== SHA256SUMS ==='
          cat dist-release/SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: FWArmy ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            dist-release/*.zip
            dist-release/*.tar.gz
            dist-release/SHA256SUMS
            dist-release/install.sh
            dist-release/install.ps1
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
